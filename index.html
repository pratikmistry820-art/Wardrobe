  const sub=groupSum(act,i=>i.subcategoryId).map(([k,v])=>{const c=S.categories[k];const root=c&&S.categories[c.parentId];return {label:(root?root.name+' › ':'')+(c?.name||''),value:v,f:{cat:root?.id||'',sub:k}}}).filter(r=>r.label);
  g+=rcard('By subcategory',barList(sub,{top:12}));tables.push(T('Items by subcategory',['Subcategory','Items'],sub.map(x=>[x.label,x.value])));
  const br=groupSum(act,i=>(i.brand||'').trim()).map(([k,v])=>({label:k,value:v,f:{brand:k}}));
  g+=rcard('By brand',barList(br),act.filter(i=>!i.brand).length?`${act.filter(i=>!i.brand).length} items have no brand recorded.`:'');tables.push(T('Items by brand',['Brand','Items'],br.map(x=>[x.label,x.value])));
  const co=groupSum(act,i=>(i.colour||'').trim()).map(([k,v])=>({label:k,value:v,sw:colourHex(k),f:{colour:k}}));
  g+=rcard('By colour',barList(co));tables.push(T('Items by colour',['Colour','Items'],co.map(x=>[x.label,x.value])));
  const us=groupSum(act,i=>i.usage).map(([k,v])=>({label:k,value:v,f:{usage:k}}));
  g+=rcard('How often they are used',barList(us),'From the “Usage” tag on each item.');tables.push(T('Items by usage tag',['Usage','Items'],us.map(x=>[x.label,x.value])));
  const se=groupSum(act,i=>i.season).map(([k,v])=>({label:k,value:v,f:{season:k}}));
  g+=rcard('By season',barList(se));tables.push(T('Items by season',['Season','Items'],se.map(x=>[x.label,x.value])));
  return {html:h+`<div class="rgrid">${g}</div>`,tables,note:'A snapshot of your wardrobe today — the period filter does not apply here.'}}

function repMoney(){const all=allItems();const priced=all.filter(i=>numOrNull(i.purchase?.price)!=null);const tables=[];
  const per=priced.filter(i=>S.rp.period==='all'||inPeriod(i.purchase?.date));
  const price=i=>Number(i.purchase.price)||0;
  const value=priced.filter(isActive).reduce((n,i)=>n+price(i),0);const spent=per.reduce((n,i)=>n+price(i),0);
  const saved=per.reduce((n,i)=>{const m=numOrNull(i.purchase?.mrp);return n+(m!=null&&m>price(i)?m-price(i):0)},0);
  let h=kpis([['Current wardrobe value',money(value),'active items, price paid'],['Spent in period',money(spent)],['Items bought',per.length],['Average price',per.length?money(Math.round(spent/per.length)):'—'],['Saved vs MRP',money(saved)]]);
  tables.push(T('Spending summary',['Measure','Value'],[['Current wardrobe value',value],['Spent in period',spent],['Items bought',per.length],['Average price',per.length?Math.round(spent/per.length):''],['Saved vs MRP',saved]]));
  // monthly
  let months=[];const P=S.rp.period;
  if(/^\d{4}$/.test(P)){for(let m=0;m<12;m++)months.push(`${P}-${pad(m+1)}`)}else{const d=new Date();d.setDate(1);for(let k=11;k>=0;k--){const x=new Date(d.getFullYear(),d.getMonth()-k,1);months.push(`${x.getFullYear()}-${pad(x.getMonth()+1)}`)}}
  const mpts=months.map(mo=>{const its=priced.filter(i=>(i.purchase?.date||'').startsWith(mo));const dt=new Date(mo+'-01T00:00');return {label:dt.toLocaleDateString('en-IN',{month:'short'}),full:dt.toLocaleDateString('en-IN',{month:'long',year:'numeric'}),value:its.reduce((n,i)=>n+price(i),0),tip:plural(its.length,'item')}});
  let g=rcard(/^\d{4}$/.test(P)?`Monthly spending in ${P}`:'Monthly spending — last 12 months',colChart(mpts),'By purchase date.');
  tables.push(T('Monthly spending',['Month','Amount (₹)','Items'],mpts.map(p=>[p.full,p.value,parseInt(p.tip)])));
  const yr=groupSum(priced,i=>(i.purchase?.date||'').slice(0,4),price).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>({label:k,value:v,tip:plural(priced.filter(i=>(i.purchase?.date||'').startsWith(k)).length,'item')}));
  g+=rcard('Yearly spending',barList(yr.slice().sort((a,b)=>b.label.localeCompare(a.label)).slice(0,10),{fmt:rpFmt.m,top:10,sort:false}),'All years, by purchase date.');
  tables.push(T('Yearly spending',['Year','Amount (₹)'],yr.map(r=>[r.label,r.value])));
  if(!S.member&&membersList().length>1){const r=membersList().map(m=>({label:m.name,value:per.filter(i=>i.memberId===m.id).reduce((n,i)=>n+price(i),0),color:memberColor(m),sw:memberColor(m)}));g+=rcard('Spending by family member',barList(r,{fmt:rpFmt.m}));tables.push(T('Spending by family member',['Member','Amount (₹)'],r.map(x=>[x.label,x.value])))}
  const cat=groupSum(per,i=>i.categoryId,price).map(([k,v])=>({label:catName(k)||'Uncategorised',value:v,f:{cat:k},tip:'avg '+money(Math.round(v/per.filter(i=>i.categoryId===k).length))}));
  g+=rcard('Spending by category',barList(cat,{fmt:rpFmt.m,top:12}));tables.push(T('Spending by category',['Category','Amount (₹)'],cat.map(x=>[x.label,x.value])));
  const br=groupSum(per,i=>(i.brand||'').trim(),price).map(([k,v])=>({label:k,value:v,f:{brand:k}}));
  g+=rcard('Spending by brand',barList(br,{fmt:rpFmt.m}));tables.push(T('Spending by brand',['Brand','Amount (₹)'],br.map(x=>[x.label,x.value])));
  const stv=groupSum(per,i=>(i.purchase?.store||'').trim(),price).map(([k,v])=>({label:k,value:v}));
  g+=rcard('Spending by store',barList(stv,{fmt:rpFmt.m,top:8}));tables.push(T('Spending by store',['Store','Amount (₹)'],stv.map(x=>[x.label,x.value])));
  const avgc=groupSum(per,i=>i.categoryId,price).map(([k,v])=>({label:catName(k)||'Uncategorised',value:v/per.filter(i=>i.categoryId===k).length}));
  g+=rcard('Average price by category',barList(avgc,{fmt:rpFmt.m,top:12}));tables.push(T('Average price by category',['Category','Average (₹)'],avgc.map(x=>[x.label,Math.round(x.value)])));
  const noPrice=all.filter(i=>numOrNull(i.purchase?.price)==null).length;const noDate=priced.filter(i=>!i.purchase?.date).length;
  return {html:h+`<div class="rgrid">${g}</div>`,tables,note:[noPrice?`${plural(noPrice,'item')} without a price ${noPrice===1?'is':'are'} left out.`:'',noDate&&S.rp.period!=='all'?`${plural(noDate,'item')} without a purchase date ${noDate===1?'counts':'count'} only under “All time”.`:''].filter(Boolean).join(' ')}}

function repCare(){const tables=[];const scoped=id=>S.items[id]&&inScope(S.items[id]);
  const txns=Object.values(S.transactions).filter(t=>t.status!=='cancelled'&&inPeriod(t.givenAt)&&txnInScope(t));
  const sent=txns.reduce((n,t)=>n+(t.itemIds||[]).filter(scoped).length,0);
  const charges=txns.reduce((n,t)=>n+(Number(t.charges)||0),0);
  const turn=[],late=[];let ontime=0,coll=0;
  for(const t of txns)for(const id of (t.itemIds||[]).filter(scoped)){const c=(t.collected||{})[id];if(!c)continue;coll++;
    turn.push((new Date(c)-new Date(t.givenAt))/864e5);
    if(t.expectedAt){const l=Math.round((parseD(dateInput(new Date(c)))-parseD(t.expectedAt))/864e5);late.push(Math.max(0,l));if(l<=0)ontime++}}
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  let h=kpis([['Times sent out',txns.length],['Items sent',sent],['Spent on services',money(charges),S.member?'whole transactions':''],['Average turnaround',avg(turn)!=null?rpFmt.d(avg(turn)):'—','given → collected'],['Average delay',avg(late)!=null?rpFmt.d(avg(late)):'—','past expected date',avg(late)>1],['Collected on time',late.length?Math.round(ontime/late.length*100)+'%':'—']]);
  tables.push(T('Care summary',['Measure','Value'],[['Times sent out',txns.length],['Items sent',sent],['Spent on services (₹)',charges],['Average turnaround (days)',avg(turn)!=null?avg(turn).toFixed(1):''],['Average delay past expected (days)',avg(late)!=null?avg(late).toFixed(1):''],['Collected on time (%)',late.length?Math.round(ontime/late.length*100):'']]));
  let g='';
  const bySvc=Object.keys(SERVICES).map(k=>({label:SERVICES[k].label,value:txns.filter(t=>t.type===k).reduce((n,t)=>n+(t.itemIds||[]).filter(scoped).length,0),color:STATUS[k].color}));
  g+=rcard('Items sent, by service',barList(bySvc));tables.push(T('Items sent by service',['Service','Items'],bySvc.map(x=>[x.label,x.value])));
  const freq=type=>{const m={};txns.filter(t=>t.type===type).forEach(t=>(t.itemIds||[]).filter(scoped).forEach(id=>m[id]=(m[id]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10)};
  const flist=(arr,lbl)=>arr.length?`<div class="list">${arr.map(([id,n])=>{const it=S.items[id];return `<button class="li" data-act="item" data-id="${id}" style="padding:6px 0"><div class="th" style="width:44px;height:52px">${itemImg(it)}</div><div class="grow"><div class="nm">${esc(it.name)}</div><div class="sb">${esc(it.code)}${S.members[it.memberId]&&!S.member?' · '+esc(memberName(it.memberId)):''}</div></div><b>${n}×</b></button>`}).join('')}</div>`:`<p class="muted small">Nothing ${lbl} in this period.</p>`;
  const fi=freq('ironing'),fd=freq('dryclean');
  g+=rcard('Most often ironed',flist(fi,'ironed'));tables.push(T('Most often ironed',['Item ID','Name','Times'],fi.map(([id,n])=>[S.items[id].code,S.items[id].name,n])));
  g+=rcard('Most often dry-cleaned',flist(fd,'dry-cleaned'));tables.push(T('Most often dry-cleaned',['Item ID','Name','Times'],fd.map(([id,n])=>[S.items[id].code,S.items[id].name,n])));
  const pv={};for(const t of txns){const k=t.providerName||'—';const p=pv[k]||(pv[k]={name:k,type:t.type,sends:0,items:0,charges:0,turn:[],late:[],pending:0});p.sends++;const ids=(t.itemIds||[]).filter(scoped);p.items+=ids.length;p.charges+=Number(t.charges)||0;
    for(const id of ids){const c=(t.collected||{})[id];if(!c){if(t.status==='open')p.pending++;continue}p.turn.push((new Date(c)-new Date(t.givenAt))/864e5);if(t.expectedAt)p.late.push(Math.max(0,Math.round((parseD(dateInput(new Date(c)))-parseD(t.expectedAt))/864e5)))}}
  const pr=Object.values(pv).sort((a,b)=>b.items-a.items);
  g+=rcard('Service providers',pr.length?`<div style="overflow-x:auto"><table class="rtab"><thead><tr><th>Shop</th><th>Sends</th><th>Items</th><th>Charges</th><th>Avg turnaround</th><th>Avg delay</th><th>Pending now</th></tr></thead><tbody>${pr.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="small muted">${esc(SERVICES[p.type]?.label||'')}</span></td><td>${p.sends}</td><td>${p.items}</td><td>${money(p.charges)}</td><td>${avg(p.turn)!=null?rpFmt.d(avg(p.turn)):'—'}</td><td class="${avg(p.late)>1?'over-tag':''}">${avg(p.late)!=null?rpFmt.d(avg(p.late)):'—'}</td><td>${p.pending}</td></tr>`).join('')}</tbody></table></div>`:`<p class="muted small">No transactions in this period.</p>`,'Delay = days collected after the expected date.');
  tables.push(T('Service providers',['Shop','Service','Sends','Items','Charges (₹)','Avg turnaround (days)','Avg delay (days)','Pending now'],pr.map(p=>[p.name,SERVICES[p.type]?.label||'',p.sends,p.items,p.charges,avg(p.turn)!=null?avg(p.turn).toFixed(1):'',avg(p.late)!=null?avg(p.late).toFixed(1):'',p.pending])));
  return {html:h+`<div class="rgrid">${g}</div>`,tables,note:'Based on transactions given out in the selected period (cancelled sends excluded).'}}

  g+=rcard('Never logged as worn — most expensive first',ilist(unworn,v=>money(v)),'Good candidates to wear more — or to donate.');

  g+=rcard('Wears by category',barList(bycat,{top:12}));tables.push(T('Wears by category',['Category','Wears'],bycat.map(x=>[x.label,x.value])));
  const ob=outs.filter(o=>o.wornCount).map(o=>({label:o.name,value:o.wornCount}));
  g+=rcard('Most worn outfits',barList(ob,{fmt:v=>v+'×'}));tables.push(T('Outfit wears',['Outfit','Times worn'],ob.map(x=>[x.label,x.value])));
  const cutoff=dateInput(addDays(new Date(),-60));

function parseCSV(text){const rows=[];let row=[],f='',q=false;text=text.replace(/^﻿/,'');for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else{if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()!==''))}
function importCSV(){if(!needDb())return;const inp=document.createElement('input');inp.type='file';inp.accept='.csv,text/csv';inp.className='filein';document.body.appendChild(inp);

    const ix={member:col('member','family member','belongs to','owner'),name:col('name','clothing name','item','item name','description'),cat:col('category','main category'),sub:col('subcategory','sub category','sub-category'),brand:col('brand'),colour:col('colour','color'),size:col('size'),pattern:col('pattern'),fabric:col('fabric','material','fabric / material'),type:col('type','clothing type'),season:col('season'),occ:col('occasion'),gender:col('gender'),loc:col('storage location','location','home storage location','storage'),pdate:col('purchase date','date of purchase'),store:col('store','purchase store','purchase store name'),price:col('price','price paid','purchase price'),mrp:col('mrp','original mrp'),notes:col('notes')};
    if(ix.name<0)return toast('No “Name” column found in the header row.','err');
    const data=rows.slice(1).filter(r=>String(r[ix.name]||'').trim());
    const others=catKids('').find(c=>norm(c.name)==='others');
    const findCat=n=>catKids('').find(c=>norm(c.name)===norm(n));
    const findSub=(root,n)=>root&&catFlat(root.id).map(x=>x.c).find(c=>norm(c.name)===norm(n));
    const findLoc=v=>{if(!v)return '';const parts=String(v).split(/\s*(?:›|>|→|\/)\s*/).map(norm).filter(Boolean);const all=Object.values(S.locations);const full=all.find(l=>norm(locPath(l.id)).split(' › ').join('|')===parts.join('|'));if(full)return full.id;const leaf=all.find(l=>norm(l.name)===parts[parts.length-1]);return leaf?leaf.id:''};
    const ok=await confirmBox(`Import ${plural(data.length,'item')}?`,`From <b>${esc(file.name)}</b>. Each row becomes a new clothing item at home with its own ID. Photos can be added afterwards.`,'Import');if(!ok)return;
    const ids=[];let k=0;const g=(r,i)=>i>=0?String(r[i]??'').trim():'';
    toast('Importing…');
    for(const r of data){k++;const root=findCat(g(r,ix.cat))||others;const sub=findSub(root,g(r,ix.sub));const nid=uid();
      const occ=g(r,ix.occ).split(/[;|\/]/).map(s=>s.trim()).filter(Boolean).map(o=>OCCASIONS.find(x=>norm(x)===norm(o))||o);
      const mem=membersList().find(m=>norm(m.name)===norm(g(r,ix.member)))?.id||(S.members[S.member]?S.member:'');
      const doc={memberId:mem,name:g(r,ix.name).slice(0,120),categoryId:root?.id||'',subcategoryId:sub?.id||'',brand:g(r,ix.brand),colour:g(r,ix.colour),size:g(r,ix.size),pattern:g(r,ix.pattern),fabric:g(r,ix.fabric),type:g(r,ix.type),season:SEASONS.find(x=>norm(x)===norm(g(r,ix.season)))||g(r,ix.season),gender:g(r,ix.gender),occasion:occ,usage:'',notes:g(r,ix.notes),homeLocationId:findLoc(g(r,ix.loc)),photos:[],
        purchase:{date:/^\d{4}-\d{2}-\d{2}$/.test(g(r,ix.pdate))?g(r,ix.pdate):'',store:g(r,ix.store),price:numOrNull(g(r,ix.price).replace(/[₹,\s]/g,'')),mrp:numOrNull(g(r,ix.mrp).replace(/[₹,\s]/g,'')),discount:null,notes:''},
        code:nextCode(),status:'home',currentTxnId:'',createdAt:nowISO(),updatedAt:nowISO(),isSample:false};
      try{await put('items',nid,doc);S.items[nid]={...doc,id:nid};ids.push(nid)}catch(e){toast(errMsg(e),'err');break}

/* ---------- image helpers: hash, colour ---------- */
async function blobImage(blob){const url=URL.createObjectURL(blob);try{const img=new Image();img.src=url;await img.decode();return img}finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}}

function dhashImg(img){const c=document.createElement('canvas');c.width=9;c.height=8;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,9,8);
  const d=x.getImageData(0,0,9,8).data;let bits='';for(let y=0;y<8;y++)for(let i=0;i<8;i++){const a=(y*9+i)*4,b=a+4;const g1=d[a]*.3+d[a+1]*.59+d[a+2]*.11,g2=d[b]*.3+d[b+1]*.59+d[b+2]*.11;bits+=g1>g2?'1':'0'}
  let hex='';for(let i=0;i<64;i+=4)hex+=parseInt(bits.slice(i,i+4),2).toString(16);return hex}
function hamming(a,b){if(!a||!b||a.length!==b.length)return 99;let n=0;for(let i=0;i<a.length;i++){let v=parseInt(a[i],16)^parseInt(b[i],16);while(v){n+=v&1;v>>=1}}return n}

async function photoHash(p){if(!p)return null;if(p.hash)return p.hash;const k=p.thumb||p.id;if(hashCache[k]!==undefined)return hashCache[k];
  try{hashCache[k]=dhashImg(await blobImage(await getAssetBlob(k)))}catch(e){hashCache[k]=null}return hashCache[k]}
const NAMED=Object.entries(COLOURS).filter(([k])=>!['gray','navy blue','multicolour','multicolor','off white','ivory','dark blue','bottle green','wine','silver','gold','denim','tan','rust','peach','charcoal'].includes(k)).map(([k,h])=>[k.replace(/\b\w/g,c=>c.toUpperCase()),[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]]);
function dominantColour(img){const c=document.createElement('canvas');c.width=60;c.height=60;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,60,60);
  const d=x.getImageData(15,12,30,36).data;const B={};for(let i=0;i<d.length;i+=4){const k=(d[i]>>5)+'.'+(d[i+1]>>5)+'.'+(d[i+2]>>5);const b=B[k]||(B[k]={n:0,r:0,g:0,b:0});b.n++;b.r+=d[i];b.g+=d[i+1];b.b+=d[i+2]}
  const top=Object.values(B).sort((a,b)=>b.n-a.n)[0];if(!top)return '';const r=top.r/top.n,g=top.g/top.n,b=top.b/top.n;
  let best='',bd=1e9;for(const [n,[R,G,Bb]] of NAMED){const rm=(r+R)/2,dr=r-R,dg=g-G,db=b-Bb;const dd=(2+rm/256)*dr*dr+4*dg*dg+(2+(255-rm)/256)*db*db;if(dd<bd){bd=dd;best=n}}return best}

function aiCatalog(){return catFlat().map(({c,depth})=>{const root=depth?(()=>{let r=c,g=0;while(r.parentId&&S.categories[r.parentId]&&g++<9)r=S.categories[r.parentId];return r})():null;return `${c.id} = ${root?root.name+' > ':''}${c.name}`}).join('\n')}
async function aiDescribe(blobs,signal){const many=blobs.length>1;
  const prompt=`You help catalogue clothes in a personal wardrobe app. ${many?`There are ${blobs.length} photos, each showing ONE clothing item.`:'The photo shows one clothing item.'}
For ${many?'each photo':'the photo'} return an object with these fields:
- "name": short descriptive name, max 6 words, e.g. "Navy checked casual shirt" (no brand unless a label is clearly readable)
- "categoryId": the id of the best MAIN category from the list below (lines without " > ")
- "subcategoryId": the id of the best subcategory from the list (a line with " > " under that main category), or ""
- "colour": main colour in plain words, e.g. "Navy Blue", "Off White", "Maroon"
- "pattern": one of ${JSON.stringify(PATTERNS)}
- "fabric": best guess of material, e.g. "Cotton", "Linen", "Denim", "Silk", or ""
- "type": fit/sleeve/style detail, e.g. "Full sleeve, slim fit", or ""

- "occasion": array using only ${JSON.stringify(OCCASIONS)}

- "description": one sentence on distinguishing details (collar, buttons, print, embroidery) that tell it apart from similar clothes
- "confidence": "high", "medium" or "low"
Categories (id = name):
${aiCatalog()}
Reply with only ${many?'a JSON array with one object per photo, in the same order as the photos':'one JSON object'}.`;
  const out=await sampleApi.json(prompt,{images:blobs,modelTier:'quick',signal});
  const arr=Array.isArray(out)?out:[out];return arr.map(cleanAI)}
function cleanAI(o){o=o&&typeof o==='object'?o:{};const str=v=>typeof v==='string'?v.trim().slice(0,160):'';

  if(sub&&(!S.categories[sub]||!(catIsUnder(sub,cat))))sub='';
  const pick=(v,list)=>list.find(x=>norm(x)===norm(v))||'';

const itemLink=id=>`${APP_URL}#i-${id}`;
function makeQR(text){const q=window.qrcode(0,'M');q.addData(text);q.make();return q}
function qrSvg(q,size=220){const n=q.getModuleCount(),m=2,s=size/(n+m*2);let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${((c+m)*s).toFixed(2)} ${((r+m)*s).toFixed(2)}h${s.toFixed(2)}v${s.toFixed(2)}h-${s.toFixed(2)}z`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="QR code"><rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
function drawQR(ctx,q,x,y,size){const n=q.getModuleCount(),s=size/n;ctx.fillStyle='#fff';ctx.fillRect(x,y,size,size);ctx.fillStyle='#000';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(Math.floor(x+c*s),Math.floor(y+r*s),Math.ceil(s),Math.ceil(s))}
function wrapText(ctx,text,maxW,maxLines){const words=String(text||'').split(/\s+/);const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);
  if(lines.length>maxLines){lines.length=maxLines;lines[maxLines-1]=lines[maxLines-1].replace(/.{0,2}$/,'')+'…'}return lines}
function drawLabel(ctx,it,x,y,w,h){ctx.save();ctx.strokeStyle='#bbb';ctx.setLineDash([6,6]);ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);ctx.setLineDash([]);
  const pad=h*.08,qs=h-pad*2;drawQR(ctx,makeQR(itemLink(it.id)),x+pad,y+pad,qs);
  const tx=x+pad*2+qs,tw=w-qs-pad*3;ctx.fillStyle='#111';ctx.font=`800 ${Math.round(h*.16)}px Manrope, Arial, sans-serif`;ctx.fillText(it.code||'',tx,y+pad+h*.15);
  ctx.font=`600 ${Math.round(h*.105)}px Manrope, Arial, sans-serif`;wrapText(ctx,it.name,tw,3).forEach((l,i)=>ctx.fillText(l,tx,y+pad+h*.32+i*h*.13));
  ctx.fillStyle='#666';ctx.font=`500 ${Math.round(h*.085)}px Manrope, Arial, sans-serif`;ctx.fillText([memberName(it.memberId),catName(it.categoryId)].filter(Boolean).join(' · ').slice(0,40),tx,y+h-pad);ctx.restore()}

/* ---------- trips / packing ---------- */
const tripIds=t=>Object.keys(t.items||{}).filter(i=>S.items[i]);
const tripPacked=t=>tripIds(t).filter(i=>t.items[i]?.packed).length+(t.extras||[]).filter(x=>x.packed).length;
const tripTotal=t=>tripIds(t).length+(t.extras||[]).length;
const tripInScope=t=>!S.member||t.memberId===S.member||tripIds(t).some(i=>inScope(S.items[i]));
function viewTrips(){const list=Object.values(S.trips).filter(tripInScope).sort((a,b)=>(a.status==='done')-(b.status==='done')||String(a.start||'9').localeCompare(String(b.start||'9')));
  return `<div style="padding-top:6px">${memberChips()}<div class="row between wrap" style="margin-top:6px"><h1>Packing lists</h1><button class="btn primary sm" data-act="tripnew">${ic('plus')} New trip</button></div></div>
  ${list.length?`<div class="txns section">${list.map(t=>{const tot=tripTotal(t),pk=tripPacked(t);const away=tripIds(t).filter(i=>!['home','transit'].includes(st(S.items[i]))).length;
    return `<button class="card txn" style="text-align:left;width:100%" data-act="tripopen" data-id="${t.id}"><div class="tt"><div class="grow"><span class="pill" style="--c:${t.status==='travelling'?'#6A6A6A':t.status==='done'?'#9A948B':'#2a78d6'}">${t.status==='travelling'?'Travelling':t.status==='done'?'Completed':'Planning'}</span><div class="pv" style="margin-top:6px">${esc(t.name)}</div></div>${ic('chev')}</div>
     <div class="mt">${t.destination?`<span>${ic('pin')} ${esc(t.destination)}</span>`:''}${t.start?`<span>${fmtShort(t.start)}${t.end?' – '+fmtShort(t.end):''}</span>`:''}<span>${pk} of ${tot} packed</span>${away&&t.status==='planning'?`<span class="over-tag">${away} not at home</span>`:''}</div>
     <div class="tthumbs">${tripIds(t).slice(0,10).map(i=>{const it=S.items[i];return `<span class="tth ${t.items[i].packed?'done':''}"><span class="b" style="display:block">${itemImg(it)}</span></span>`}).join('')}</div>
     <div class="prog"><i style="width:${tot?Math.round(pk/tot*100):0}%"></i></div></button>`}).join('')}</div>`
   :`<div class="empty"><h3>No trips yet</h3><p>Make a packing list for your next trip: pick clothes from the wardrobe (or whole outfits), add other things to carry, and tick them off as you pack.</p><button class="btn primary" data-act="tripnew">${ic('plus')} Plan a trip</button></div>`}`}
async function editTrip(id,preIds){if(!needDb())return;const t=id?S.trips[id]:null;
  const fields=[{name:'name',label:'Trip name',value:t?.name||'',required:true,placeholder:'e.g. Goa wedding'},{name:'destination',label:'Destination',value:t?.destination||''},{name:'start',label:'Leaving on',type:'date',value:t?.start||''},{name:'end',label:'Back on',type:'date',value:t?.end||''}];
  if(membersList().length>1)fields.push({name:'memberId',label:'Who is travelling',type:'select',value:t?.memberId??S.member??'',options:[{value:'',label:'Whole family / several'},...membersList().map(m=>({value:m.id,label:m.name}))]});
  const v=await dialog({title:t?'Edit trip':'New trip',fields,ok:t?'Save':'Create'});if(!v)return;
  if(v.start&&v.end&&v.end<v.start)return toast('The return date is before the start date.','err');
  try{if(t){await upd('trips',id,{name:v.name,destination:v.destination,start:v.start,end:v.end,memberId:v.memberId||''})}
    else{const nid=uid();const items={};(preIds||[]).forEach(i=>items[i]={packed:false});await put('trips',nid,{name:v.name,destination:v.destination,start:v.start,end:v.end,memberId:v.memberId||'',items,extras:[],status:'planning',createdAt:nowISO()});go('trips');setTimeout(()=>openTrip(nid),150)}}catch(e){toast(errMsg(e),'err')}}
let tripSheet=null;
function openTrip(id){if(tripSheet)tripSheet.close();tripSheet=sheet({title:'',full:true,body:'',onClose:()=>{tripSheet=null}});tripSheet.id=id;tripSheet.sig='';refreshTrip()}
function refreshTrip(){if(!tripSheet)return;const t=S.trips[tripSheet.id];if(!t){tripSheet.close();return}const ids=tripIds(t);const sig=JSON.stringify([t,ids.map(i=>S.items[i].status)]);if(sig===tripSheet.sig)return;tripSheet.sig=sig;
  $('.sh h2',tripSheet.node).textContent=t.name;const tot=tripTotal(t),pk=tripPacked(t);const sc=tripSheet.body.scrollTop;
  const away=ids.filter(i=>!['home','transit'].includes(st(S.items[i])));
  tripSheet.body.innerHTML=`<div class="mt" style="display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)">${t.destination?`<span>${ic('pin')} ${esc(t.destination)}</span>`:''}${t.start?`<span>${fmtDate(t.start)}${t.end?' – '+fmtDate(t.end):''}</span>`:''}${S.members[t.memberId]?`<span>${mdot(t.memberId)} ${esc(memberName(t.memberId))}</span>`:''}</div>
   <div class="prog" style="height:8px;margin-top:12px"><i style="width:${tot?Math.round(pk/tot*100):0}%"></i></div><div class="small muted" style="margin-top:5px"><b style="color:var(--ink)">${pk} of ${tot}</b> packed${t.status==='travelling'?' · <b>travelling</b>':t.status==='done'?' · trip completed':''}</div>
   ${away.length&&t.status==='planning'?`<div class="outbox" style="--c:#B4472F">${ic('alert')} Not at home yet: ${away.map(i=>`<b>${esc(S.items[i].name)}</b> (${esc(itemOutLabel(S.items[i]))})`).join(', ')}. Collect ${away.length===1?'it':'them'} before you pack.</div>`:''}
   <div class="row between" style="margin:18px 0 10px"><h3>Clothes (${ids.length})</h3><span class="row" style="gap:6px"><button class="btn xs" data-act="tripadd" data-id="${t.id}">${ic('plus')} Clothes</button><button class="btn xs" data-act="tripoutfit" data-id="${t.id}">${ic('layers')} Outfit</button></span></div>
   ${ids.length?`<div class="picks">${ids.map(i=>{const it=S.items[i];const p=t.items[i].packed;return `<button type="button" class="pick ${p?'sel':''}" data-act="trippack" data-id="${t.id}" data-i="${i}"><div class="b">${itemImg(it)}${!['home','transit'].includes(st(it))?`<span class="badge" style="--c:${STATUS[st(it)].color}">${esc(STATUS[st(it)].short)}</span>`:''}</div><span class="selck">${ic('check')}</span><div class="l">${membersList().length>1&&S.members[it.memberId]?mdot(it.memberId)+' ':''}${esc(it.name)}</div></button>`}).join('')}</div><p class="hint">Tap a photo to mark it packed.</p>`:`<p class="muted small">No clothes yet — add individual clothes or whole outfits.</p>`}
   <div class="row between" style="margin:18px 0 6px"><h3>Other things to carry</h3></div>
   <div class="card" style="padding:4px 14px">${(t.extras||[]).map((x,k)=>`<div class="pvrow" style="padding:8px 0"><label class="chk grow" style="min-height:30px"><input type="checkbox" data-act="tripx" data-id="${t.id}" data-k="${k}" ${x.packed?'checked':''}> <span style="${x.packed?'text-decoration:line-through;color:var(--ink-3)':''}">${esc(x.text)}</span></label><button class="iconbtn" style="width:30px;height:30px" data-act="tripxdel" data-id="${t.id}" data-k="${k}">${ic('x')}</button></div>`).join('')}
    <form class="row" id="tx-form" style="padding:8px 0"><input class="in" id="tx-in" placeholder="e.g. Phone charger, toothbrush, belt" style="height:40px"><button class="btn sm" type="submit">Add</button></form>
    ${(t.extras||[]).length?'':`<div class="chips" style="margin:0 0 10px">${['Toiletries','Charger','Medicines','Sunglasses','Belt','Socks','Umbrella'].map(s=>`<button type="button" class="chip" data-act="tripxq" data-id="${t.id}" data-k="${s}">+ ${s}</button>`).join('')}</div>`}</div>
   <div class="dacts" style="margin-top:18px">${t.status==='planning'?`<button class="btn sm primary" data-act="tripstart" data-id="${t.id}">${ic('out')} Start trip</button>`:t.status==='travelling'?`<button class="btn sm primary" data-act="tripend" data-id="${t.id}">${ic('home')} Back home — unpack</button>`:''}
    <button class="btn sm" data-act="tripedit" data-id="${t.id}">${ic('edit')} Edit details</button><button class="btn sm" data-act="tripreset" data-id="${t.id}">${ic('undo')} Untick all</button><button class="btn sm ghost" style="color:var(--danger)" data-act="tripdel" data-id="${t.id}">${ic('trash')} Delete</button></div>
   <p class="hint">“Start trip” marks the packed clothes as <b>In transit</b> so they don't show as available at home; “Back home” returns them to their storage places.</p>`;
  tripSheet.body.scrollTop=sc;
  const f=$('#tx-form',tripSheet.body);if(f)f.onsubmit=e=>{e.preventDefault();const v=$('#tx-in',f).value.trim();if(v)tripExtras(t.id,x=>x.concat([{text:v.slice(0,80),packed:false}]))}}
async function tripSetItems(id,ids){const t=S.trips[id];const items={};ids.forEach(i=>items[i]=t.items?.[i]||{packed:false});const {id:_,...rest}=t;try{await put('trips',id,{...rest,items})}catch(e){toast(errMsg(e),'err')}}
async function tripExtras(id,fn){const t=S.trips[id];try{await upd('trips',id,{extras:fn([...(t.extras||[])])})}catch(e){toast(errMsg(e),'err')}}
async function tripPick(id){const t=S.trips[id];const sel=await pickItems({title:'Clothes for '+t.name,selected:tripIds(t),note:'Clothes that are at the ironing shop or elsewhere can be added — you\'ll be reminded to collect them.'});if(sel)tripSetItems(id,sel)}
function tripOutfit(id){const t=S.trips[id];const outs=Object.values(S.outfits).filter(outfitInScope);if(!outs.length)return toast('No outfits yet — create one in Outfits.','err');
  const r=sheet({title:'Add an outfit',body:`<div class="list">${outs.map(o=>`<button class="card li" data-o="${o.id}"><div class="th">${collage(outfitItems(o))}</div><div class="grow"><div class="nm">${esc(o.name)}</div><div class="sb">${plural(outfitItems(o).length,'item')}${o.occasion?' · '+esc(o.occasion):''}</div></div>${ic('plus')}</button>`).join('')}</div>`});
  r.node.addEventListener('click',e=>{const b=e.target.closest('[data-o]');if(!b)return;r.close();const o=S.outfits[b.dataset.o];tripSetItems(id,[...new Set([...tripIds(t),...(o.itemIds||[]).filter(i=>S.items[i])])]);toast(`${o.name} added`)})}
async function tripStart(id){if(!needDb())return;const t=S.trips[id];const packed=tripIds(t).filter(i=>t.items[i].packed);const ok=packed.filter(i=>st(S.items[i])==='home');const skip=packed.length-ok.length;
  if(!packed.length)return toast('Tick the clothes you have packed first.','err');
  if(!await confirmBox(`Start “${t.name}”?`,`${plural(ok.length,'packed item')} will be marked as in transit.${skip?` ${skip} packed item(s) are not at home and will be left as they are.`:''}${tripIds(t).length>packed.length?` ${tripIds(t).length-packed.length} unpacked item(s) stay at home.`:''}`,'Start trip'))return;
  try{for(const i of ok)await upd('items',i,{status:'transit',outsideWith:'Trip: '+t.name,outsideSince:nowISO(),tripId:id,updatedAt:nowISO()});
    if(ok.length)await logMove({kind:'trip',itemIds:ok,activity:`Packed for trip: ${t.name}`,location:t.destination||t.name,status:'transit'});
    await upd('trips',id,{status:'travelling',startedAt:nowISO()});refreshHistSoon(ok);toast('Have a good trip!')}catch(e){toast(errMsg(e),'err')}}
async function tripEnd(id){if(!needDb())return;const t=S.trips[id];const ids=Object.values(S.items).filter(i=>i.tripId===id&&st(i)==='transit').map(i=>i.id);
  if(!await confirmBox('Back home?',`${plural(ids.length,'item')} will be marked as at home in their usual storage places. Anything that went to the laundry can then be sent from My Wardrobe.`,'Unpack'))return;
  try{for(const i of ids)await upd('items',i,{status:'home',outsideWith:'',outsideSince:'',tripId:'',updatedAt:nowISO()});
    if(ids.length)await logMove({kind:'trip',itemIds:ids,activity:`Back from trip: ${t.name}`,location:'Original storage locations',status:'home'});
    await upd('trips',id,{status:'done',endedAt:nowISO()});refreshHistSoon(ids);toast('Welcome back — everything is unpacked')}catch(e){toast(errMsg(e),'err')}}
async function tripDel(id){const t=S.trips[id];if(t.status==='travelling')return toast('Use “Back home — unpack” before deleting this trip.','err');if(!await confirmBox('Delete this packing list?','The clothes are not affected.','Delete',true))return;try{await del('trips',id);toast('Trip deleted')}catch(e){toast(errMsg(e),'err')}}

/* ---------- selection actions ---------- */
function openSelActions(){const ids=[...S.select];if(!ids.length)return;
  const r=sheet({title:plural(ids.length,'item')+' selected',body:`<div class="list">
   ${Object.entries(SERVICES).map(([k,s])=>`<button class="card li" data-k="send:${k}" style="padding:13px">${ic(s.icon)}<span class="grow nm">Send for ${esc(s.label.toLowerCase())}</span>${ic('chev')}</button>`).join('')}
   <button class="card li" data-k="outfit" style="padding:13px">${ic('layers')}<span class="grow nm">Create outfit from these</span>${ic('chev')}</button>
   <button class="card li" data-k="trip" style="padding:13px">${ic('box')}<span class="grow nm">Add to a packing list</span>${ic('chev')}</button>
   <button class="card li" data-k="qr" style="padding:13px">${ic('qr')}<span class="grow nm">Print QR labels (PDF)</span>${ic('chev')}</button></div>`});
  r.node.addEventListener('click',async e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;r.close();
    if(k.startsWith('send:'))openSend(ids,k.slice(5));else if(k==='outfit')editOutfit(null,ids);else if(k==='qr')labelsPDF(ids);
    else if(k==='trip'){const trips=Object.values(S.trips).filter(t=>t.status!=='done');
      if(!trips.length)return editTrip(null,ids);
      const r2=sheet({title:'Add to which trip?',body:`<div class="list">${trips.map(t=>`<button class="card li" data-t="${t.id}" style="padding:13px">${ic('box')}<span class="grow"><span class="nm">${esc(t.name)}</span><span class="sb">${t.start?fmtShort(t.start):''} · ${plural(tripIds(t).length,'item')}</span></span>${ic('plus')}</button>`).join('')}<button class="card li" data-t="" style="padding:13px">${ic('plus')}<span class="grow nm">New trip…</span></button></div>`});
      r2.node.addEventListener('click',ev=>{const bb=ev.target.closest('[data-t]');if(!bb)return;r2.close();if(!bb.dataset.t)return editTrip(null,ids);const t=S.trips[bb.dataset.t];tripSetItems(t.id,[...new Set([...tripIds(t),...ids])]);toast(`Added to ${t.name}`,'',{label:'Open',fn:()=>openTrip(t.id)})})}})}

/* ---------- bulk AI review ---------- */
async function bulkAI(files,n,catSel){const box=$('#b-ai',n);const max=Math.max(1,Math.min(aiImgMax||1,8));const res=[];const ctl=new AbortController();n._aiCtl=ctl;
  box.innerHTML=`<div class="aibox"><div class="row"><span class="spin" style="width:18px;height:18px;border-width:2px"></span><b class="grow" id="b-aip">Looking at photos… 0 / ${files.length}</b><button type="button" class="btn xs" id="b-aistop">Stop</button></div></div>`;
  $('#b-aistop',n).onclick=()=>ctl.abort();
  try{for(let i=0;i<files.length;i+=max){const chunk=files.slice(i,i+max);const blobs=[];for(const f of chunk)blobs.push(await shrink(f,1024,.82));
      const out=await aiDescribe(blobs,ctl.signal);for(let k=0;k<chunk.length;k++)res.push(out[k]||cleanAI({}));const p=$('#b-aip',n);if(p)p.textContent=`Looking at photos… ${res.length} / ${files.length}`}}
  catch(e){const m=aiErr(e);if(m)toast(m,'err')}
  while(res.length<files.length)res.push(null);return res}

/* ---------------- full backup (ZIP with photos) ---------------- */
const BACKUP_COLS=['items','categories','locations','providers','transactions','members','reminders','outfits','trips'];
async function getAssetBlob(id){if(window.platformGetBlob)return window.platformGetBlob(id);const r=await fetch(blobUrl(id));if(!r.ok)throw new Error('missing');return r.blob()}
function assetIdsOf(cols){const ids=new Set();for(const it of Object.values(cols.items||{})){for(const p of it.photos||[]){if(p.id)ids.add(p.id);if(p.thumb)ids.add(p.thumb)}const iv=it.purchase&&it.purchase.invoice;if(iv){if(iv.id)ids.add(iv.id);if(iv.thumb)ids.add(iv.thumb)}}return [...ids]}
async function backupZip(){if(!db)return;
  try{await loadLib('zip')}catch(e){return toast(e.message,'err')}
  const cols={};for(const c of BACKUP_COLS){cols[c]={};for(const [id,v] of Object.entries(S[c]||{})){const {id:_,...rest}=v;cols[c][id]=rest}}
  try{const mv=await allMovements();cols.movements={};for(const m of mv){const {id,...rest}=m;cols.movements[id]=rest}}catch(e){cols.movements={}}
  const zip=new window.JSZip();const ids=assetIdsOf(cols);let ok=0,miss=0;toast(`Packing ${plural(ids.length,'photo')}…`);
  for(const id of ids){try{const b=await getAssetBlob(id);zip.file('photos/'+id+'.jpg',b);ok++}catch(e){miss++}}
  zip.file('data.json',JSON.stringify({app:'wardrobe',version:2,exportedAt:nowISO(),collections:cols},null,1));
  zip.file('README.txt','Wardrobe full backup.\\ndata.json = all records; photos/ = every photo and thumbnail, named by photo id.\\nRestore it in the Wardrobe app: Settings > Restore from backup.');
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:5}});
  saveFile(`wardrobe-full-backup-${todayStr()}.zip`,blob);if(miss)toast(`${miss} photo file(s) could not be read and were skipped.`,'err')}

/* ---------------- boot ---------------- */
async function waitClaude(){for(let i=0;i<100;i++){if(window.claude&&typeof window.claude.use==='function')return true;await sleep(100)}return false}
async function boot(){route();render();
  if(!await waitClaude()){S.conn='nodb';render();return}
  try{db=await window.claude.use('db')}catch(e){db=null}
  if(!db){S.conn='nodb';render();return}
  window.claude.use('assets').then(a=>{assets=a||null;render()}).catch(()=>{});
  window.claude.use('sample').then(async sm=>{sampleApi=sm||null;if(sm){try{const L=await sm.limits();aiImgMax=L?.images?.maxCount||0}catch(e){aiImgMax=0}}render()}).catch(()=>{});
  window.claude.use('user').then(u=>{user=u;if(u&&typeof u.can==='function'){Promise.resolve(u.can('data.write')).then(v=>{if(v===false){canWrite=false;render()}}).catch(()=>{})}}).catch(()=>{});
  S.conn='loading';
  const timer=setTimeout(()=>{if(!COLS.every(c=>S.loaded[c])){S.conn='slow';COLS.forEach(c=>S.loaded[c]=true);render()}},10000);
  COLS.forEach(c=>{db.collection(c).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]={...d.data(),id:d.id}});S[c]=m;
      if(!snap.metadata.fromCache)S.loaded[c]=true;
      if(COLS.every(k=>S.loaded[k])&&S.conn!=='error'){clearTimeout(timer);if(S.conn!=='ok'){S.conn='ok';setTimeout(checkReminders,800)}}
      if(S.selectMode)for(const id of [...S.select])if(!S.items[id]||isArch(S.items[id]))S.select.delete(id);
      render()},
    err=>{S.loaded[c]=true;S.conn=err&&err.code==='revoked'?'nodb':'error';S.connErr=err?.message||'';render()})});
  setInterval(checkReminders,60000);
}
boot();
